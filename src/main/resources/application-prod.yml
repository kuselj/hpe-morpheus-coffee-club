# Packaged standalone JAR and container runtime.
# The compiled React bundle is served from the JAR's /static folder on the same port as the API.
spring:
  jpa:
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.hpe.morpheus.coffeeclub: INFO
    org.springframework.web: WARN
