spring:
  application:
    name: hpe-morpheus-coffee-club

  # File-backed H2 so the order history survives server restarts.
  datasource:
    url: jdbc:h2:file:./data/coffeedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # The table is created by schema.sql so that the physical column order matches the agreed
  # contract; Hibernate would otherwise emit the columns alphabetically.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jpa:
    hibernate:
      # Hibernate never writes DDL; it only checks the entity still matches schema.sql.
      ddl-auto: validate
    # Defer JPA startup until the schema script has run.
    defer-datasource-initialization: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 3600
          cache-public: true

server:
  # Render (and any other PaaS) injects PORT; fall back to 8080 for local runs.
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.hpe.morpheus.coffeeclub: INFO
