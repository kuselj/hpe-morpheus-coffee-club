spring:
  datasource:
    url: jdbc:h2:mem:coffeedb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # Tests run against the same schema.sql as production, so entity/schema drift fails the build.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    com.hpe.morpheus.coffeeclub: INFO
